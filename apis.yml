aid: dji
name: DJI
description: >-
  DJI (Da-Jiang Innovations) is the world's leading manufacturer of civilian
  drones, aerial-imaging systems, gimbals, and robotics platforms. Its developer
  program at developer.dji.com exposes several products for building on DJI
  hardware: the Cloud API (device management, media, and live streaming for
  enterprise fleets), the FlightHub 2 API, the Mobile SDK (Android/iOS), the
  Payload SDK for building custom payloads, the Onboard SDK, the Edge SDK, the
  Windows SDK, the UX SDK, and the Guidance and RoboMaster SDKs. Developers
  register an application through a DJI developer account to obtain an App Key,
  App Secret, and App License that activate SDK and Cloud API access.
